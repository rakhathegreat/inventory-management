<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Google OAuth Callback</title>
  </head>
  <body>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var code = params.get("code");
        var error = params.get("error");
        var target = "/#/oauth/google/callback";

        if (code) {
          window.location.replace(target + "?code=" + encodeURIComponent(code));
          return;
        }

        window.location.replace(
          target + "?error=" + encodeURIComponent(error || "oauth_failed")
        );
      })();
    </script>
  </body>
</html>
